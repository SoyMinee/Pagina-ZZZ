<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenless Logic | Proxies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>

    <div class="scroll-wrapper">
        <div class="main-viewport">
            <div id="hero" class="hero-container">
                <h1 class="main-title">
                    <span class="fade-text">ZENLESS L</span><span id="theO" class="morphed-o">O</span><span class="fade-text">GIC</span>
                </h1>
            </div>

            <div id="uiLayer" class="character-ui">
                <div class="marquee-bg" id="marqueeText"></div>
                
                <div class="char-display">
                    <img id="mainCharImg" src="media/anby_full.png" alt="">
                </div>

                <div class="info-box" id="infoBox">
                    
                    <div id="summaryView">
                        <h2 id="charName">ANBY DEMARA</h2>
                        <p id="charDesc">Soldado táctico de las Liebres Astutas.</p>
                        
                        <div class="thumbnails-nav">
                            <div class="nav-item" onclick="changeChar(-1)">
                                <span>PREV_FILE</span>
                                <img id="thumbPrev" src="media/cissia_thumb.png" alt="">
                            </div>
                            <div class="nav-item" onclick="changeChar(1)">
                                <span>NEXT_FILE</span>
                                <img id="thumbNext" src="media/nicole_thumb.png" alt="">
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn-zzz select-btn" onclick="selectAgent()">
                                <span class="btn-tag">//</span> SELECT_AGENT
                            </button>
                            <button class="btn-zzz list-btn" onclick="showFullList()">
                                <span class="btn-tag">::</span> DATA_BANK
                            </button>
                        </div>
                    </div>

                    <div id="detailsView" class="details-panel">
                        <div class="details-grid">
                            <div class="col-left">
                                <h3>SETS RECOMENDADOS</h3>
                                <div class="sets-container">
                                    <div class="set-item">
                                        <div class="set-placeholder">
                                            <img id="4pc" src="" alt="">
                                        </div>
                                        <span>SET_01 (4_PC)</span>
                                    </div>
                                    <div class="set-item">
                                        <div class="set-placeholder">
                                            <img id="2pc" src="" alt="">
                                        </div>
                                        <span>SET_02 (2_PC)</span>
                                    </div>
                                </div>

                                <div class="role-section">
                                    <p>ROL: <span id="charRole" class="accent-text">---</span></p>
                                </div>

                                <h3>ORDEN DE MEJORAS</h3>
                                <div class="skills-priority">
                                    <div class="skill-slot" title="Letras">L</div>
                                    <div class="skill-slot" title="Habilidad">H</div>
                                    <div class="skill-slot" title="Básicos">B</div>
                                    <div class="skill-slot" title="Definitiva">D</div>
                                </div>
                                <button class="btn-zzz small-btn" onclick="backToSummary()">[ BACK_TO_FILES ]</button>
                            </div>

                            <div class="col-right">
                                <h3>RECOMMENDED_TEAMS</h3>
                                <div id="teamsContainer" class="teams-container">
                                    <div class="team-row">
                                        <img id="mc" src="media/anby_thumb.png" class="team-thumb">
                                        <img id="tm1" src="media/billy_thumb.png" class="team-thumb">
                                        <img id="tm2" src="media/nicole_thumb.png" class="team-thumb">
                                    </div>
                                    <div class="team-row">
                                        <img id="mc2" src="media/anby_thumb.png" class="team-thumb">
                                        <img id="tm3" src="media/rina_thumb.png" class="team-thumb">
                                        <img id="tm4" src="media/seth_thumb.png" class="team-thumb">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div> 
                </div> 
            </div>
        </div>
    </div>

    <div id="dataBankModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="btn-tag">//</span> DATABASE_ACCESS_GRANTED
                <button class="close-modal" onclick="closeFullList()">[ ESC_CLOSE ]</button>
            </div>
            <div id="agentsGrid" class="agents-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
