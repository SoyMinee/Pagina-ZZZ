<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenless Logic | Portal Experience</title>
    <style>
        :root {
            --accent-color: #a4ff00;
            --bg-dark: #0a0a0a;
            --text-main: #ffffff;
            font-size: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: 'Arial Black', 'Arial Bold', sans-serif;
            overflow: hidden;
            line-height: 1.2;
        }

        /* Contenedor principal con Snap Scroll */
        .scroll-container {
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
        }

        /* HERO SECTION - Altura extra para el recorrido del scroll */
        .hero {
            height: 250vh;
        }

        .hero-sticky {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000;
        }

        .hero-title {
            font-size: clamp(2.5rem, 15vw, 10rem);
            text-align: center;
            z-index: 10;
            font-style: italic;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* La "O" que se expande */
        .portal-o {
            display: inline-block;
            color: transparent;
            -webkit-text-stroke: 0.15rem var(--accent-color);
            transform-origin: center center;
            will-change: transform;
            transition: color 0.2s ease;
        }

        .hero-subtitle {
            margin-top: 2rem;
            font-size: 0.75rem;
            letter-spacing: 0.5rem;
            opacity: 0.6;
            text-align: center;
            z-index: 10;
        }

        /* SHOWCASE SECTION */
        .showcase-section {
            background-color: var(--bg-dark);
            z-index: 20;
        }

        .main-container {
            display: flex;
            height: 100%;
            width: 100%;
            opacity: 0;
            transform: translateY(2rem);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .main-container.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* Sidebar con botones */
        .sidebar {
            width: 22rem;
            padding: 4rem 2rem;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(1.5rem);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 30;
        }

        .logo {
            font-size: 1.2rem;
            margin-bottom: 3rem;
            border-left: 0.25rem solid var(--accent-color);
            padding-left: 1rem;
            letter-spacing: 0.2rem;
        }

        .char-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 900;
            text-align: left;
            padding: 1rem 0;
            cursor: pointer;
            opacity: 0.2;
            transition: 0.4s ease;
            font-style: italic;
            font-family: inherit;
        }

        .char-btn.active {
            opacity: 1;
            color: var(--accent-color);
            transform: translateX(1.5rem);
        }

        /* Escenario del personaje */
        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
            position: relative;
            gap: 3rem;
        }

        .character-wrapper {
            height: 85vh;
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .char-appearance {
            height: 95%;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            filter: drop-shadow(0 0 2rem rgba(0, 0, 0, 0.8));
        }

        .info-card {
            flex: 1;
            max-width: 32rem;
            z-index: 10;
        }

        .faction-tag {
            color: var(--accent-color);
            font-size: 0.8rem;
            letter-spacing: 0.4rem;
            display: block;
            margin-bottom: 1rem;
        }

        .char-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .char-description {
            color: #999;
            line-height: 1.6;
            font-family: sans-serif;
            font-size: 1rem;
            margin-bottom: 2.5rem;
            font-weight: normal;
        }

        .cta-button {
            background: none;
            border: 0.15rem solid var(--accent-color);
            color: #fff;
            padding: 1rem 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            font-family: sans-serif;
        }

        .cta-button:hover {
            background: var(--accent-color);
            color: #000;
        }

        .bg-text-giant {
            position: absolute;
            bottom: -2rem;
            right: -2rem;
            font-size: 25vw;
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
        }

        /* Responsividad para móviles */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                padding: 1.5rem;
                flex-direction: row;
                overflow-x: auto;
                justify-content: flex-start;
                gap: 2rem;
                position: absolute;
                top: 0;
                background: rgba(0, 0, 0, 0.8);
            }

            .logo { display: none; }

            .char-btn {
                font-size: 1rem;
                padding: 0.5rem 0;
                white-space: nowrap;
            }

            .char-btn.active {
                transform: translateY(-0.3rem);
            }

            .stage {
                flex-direction: column;
                padding-top: 6rem;
                justify-content: space-between;
                gap: 1rem;
            }

            .character-wrapper {
                height: 45vh;
                order: 1;
            }

            .info-card {
                order: 2;
                text-align: center;
                padding: 1rem;
            }

            .char-title {
                font-size: 2.5rem;
            }

            .char-description {
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
            }

            .bg-text-giant {
                display: none;
            }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            font-size: 0.6rem;
            letter-spacing: 0.3rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-0.6rem); }
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <!-- SECCIÓN 1: HERO CON PORTAL DINÁMICO -->
        <section class="hero">
            <div class="hero-sticky">
                <h1 class="hero-title">
                    ZENLESS<br>
                    L<span class="portal-o">O</span>GIC
                </h1>
                <p class="hero-subtitle">DISEÑO DINÁMICO • LÓGICA PURA</p>
                <div class="scroll-indicator">DESLIZA HACIA ABAJO</div>
            </div>
        </section>

        <!-- SECCIÓN 2: EXPOSITOR DE PERSONAJES -->
        <section class="showcase-section">
            <div id="app" class="main-container">
                <nav class="sidebar">
                    <div class="logo">PROYECTO_Z</div>
                    <div id="char-selector"></div>
                </nav>

                <main class="stage">
                    <div class="character-wrapper">
                        <img src="" alt="Cargando..." id="char-img" class="char-appearance">
                    </div>
                    
                    <div class="info-card">
                        <span id="char-faction" class="faction-tag"></span>
                        <h1 id="char-name" class="char-title"></h1>
                        <p id="char-desc" class="char-description"></p>
                        <button class="cta-button">Ver Expediente</button>
                    </div>
                </main>

                <div id="bg-text" class="bg-text-giant"></div>
            </div>
        </section>
    </div>

    <script>
        const CHARACTERS = [
            {
                name: "ANBY DEMARA",
                faction: "CUNNING HARES",
                color: "#a4ff00",
                description: "Una joven tranquila con un estilo de combate excepcionalmente eficiente. Le encantan las hamburguesas y las películas de serie B. Su manejo de la espada es quirúrgico.",
                image: "https://file-zzz.hoyoverse.com/mihoyo/zzz/main/character/anby/stand.png" 
            },
            {
                name: "BILLY KID",
                faction: "CUNNING HARES",
                color: "#ff3e3e",
                description: "Un cyborg entusiasta y despreocupado. Es un fanático absoluto de los 'Starlight Knights'. Sus pistolas duales nunca fallan un tiro mientras bromea.",
                image: "https://file-zzz.hoyoverse.com/mihoyo/zzz/main/character/billy/stand.png"
            },
            {
                name: "NICOLE DEMARA",
                faction: "CUNNING HARES",
                color: "#ff69b4",
                description: "Líder de las Liebres Astutas. Su astucia para los negocios solo es superada por su habilidad para meterse en problemas financieros y resolverlos con su maletín-cañón.",
                image: "https://file-zzz.hoyoverse.com/mihoyo/zzz/main/character/nicole/stand.png"
            }
        ];

        const scrollContainer = document.querySelector('.scroll-container');
        const portalO = document.querySelector('.portal-o');
        const heroSubtitle = document.querySelector('.hero-subtitle');
        const showcase = document.querySelector('.main-container');

        // LÓGICA DE TRANSICIÓN DE SCROLL
        scrollContainer.addEventListener('scroll', () => {
            const scrollY = scrollContainer.scrollTop;
            const vh = window.innerHeight;
            
            // Calculamos el progreso durante el scroll de la primera sección (1.2vh para más suavidad)
            const progress = Math.min(scrollY / (vh * 1.2), 1);

            // Escalado masivo para que la 'O' se convierta en la pared de color
            // Usamos un factor de escala alto para cubrir pantallas anchas
            const scale = 1 + (progress * 130);
            portalO.style.transform = `scale(${scale})`;

            // Cambio a color sólido y eliminación de stroke
            if (progress > 0.1) {
                portalO.style.color = 'var(--accent-color)';
                portalO.style.webkitTextStroke = '0px transparent';
            } else {
                portalO.style.color = 'transparent';
                portalO.style.webkitTextStroke = '0.15rem var(--accent-color)';
            }

            // Desvanecer textos del hero
            heroSubtitle.style.opacity = Math.max(0, 1 - (progress * 4));

            // Revelar la siguiente sección cuando la O está cerca de cubrirlo todo
            if (progress > 0.85) {
                showcase.classList.add('reveal');
            } else {
                showcase.classList.remove('reveal');
            }
        });

        // LÓGICA DEL SELECTOR DE PERSONAJES
        const selector = document.getElementById('char-selector');
        const charImg = document.getElementById('char-img');
        const charName = document.getElementById('char-name');
        const charFaction = document.getElementById('char-faction');
        const charDesc = document.getElementById('char-desc');
        const bgText = document.getElementById('bg-text');

        function updateCharacter(index) {
            const char = CHARACTERS[index];
            
            // Animación de salida
            charImg.style.opacity = "0";
            charImg.style.transform = "scale(0.9) translateX(2rem)";

            setTimeout(() => {
                // Actualizar variables de CSS y contenido
                document.documentElement.style.setProperty('--accent-color', char.color);
                charImg.src = char.image;
                charName.innerText = char.name;
                charFaction.innerText = char.faction;
                charDesc.innerText = char.description;
                bgText.innerText = char.name.split(' ')[0];
                
                // Animación de entrada
                charImg.style.opacity = "1";
                charImg.style.transform = "scale(1) translateX(0)";

                // Actualizar botones
                document.querySelectorAll('.char-btn').forEach((btn, i) => {
                    btn.classList.toggle('active', i === index);
                });
            }, 300);
        }

        // Crear botones de navegación
        CHARACTERS.forEach((char, index) => {
            const btn = document.createElement('button');
            btn.className = `char-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = char.name;
            btn.onclick = () => updateCharacter(index);
            selector.appendChild(btn);
        });

        // Inicializar primer personaje
        updateCharacter(0);

        // Ajuste de escala al redimensionar ventana
        window.addEventListener('resize', () => {
            scrollContainer.dispatchEvent(new Event('scroll'));
        });
    </script>
</body>
</html>
