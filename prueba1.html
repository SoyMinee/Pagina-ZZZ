<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenless Logic | Portal Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scroll-container">
        <!-- SECCIÓN 1: HERO CON PORTAL DINÁMICO -->
        <section class="hero">
            <div class="hero-sticky">
                <h1 class="hero-title">
                    ZENLESS<br>
                    L<span class="portal-o">O</span>GIC
                </h1>
                <p class="hero-subtitle">DISEÑO DINÁMICO • LÓGICA PURA</p>
                <div class="scroll-indicator">DESLIZA HACIA ABAJO</div>
            </div>
        </section>

        <!-- SECCIÓN 2: EXPOSITOR DE PERSONAJES -->
        <section class="showcase-section">
            <div id="app" class="main-container">
                <nav class="sidebar">
                    <div class="logo">PROYECTO_Z</div>
                    <div id="char-selector"></div>
                </nav>

                <main class="stage">
                    <div class="character-wrapper">
                        <img src="" alt="Cargando..." id="char-img" class="char-appearance">
                    </div>
                    
                    <div class="info-card">
                        <span id="char-faction" class="faction-tag"></span>
                        <h1 id="char-name" class="char-title"></h1>
                        <p id="char-desc" class="char-description"></p>
                        <button class="cta-button">Ver Expediente</button>
                    </div>
                </main>

                <div id="bg-text" class="bg-text-giant"></div>
            </div>
        </section>
    </div>

    
</body>
</html>
